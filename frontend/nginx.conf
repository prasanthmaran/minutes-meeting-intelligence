server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://api.elevenlabs.io https://livekit.rtc.elevenlabs.io wss://livekit.rtc.elevenlabs.io; media-src 'self' blob:; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
